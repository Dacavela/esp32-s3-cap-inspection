
; ── Configuración compartida ──────────────────────────────────────────────────
[common]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
; Evita que el monitor toglee DTR/RTS al (re)conectar — en el S3 con
; USB-Serial/JTAG nativo eso cuelga el chip hasta reset físico.
monitor_dtr = 0
monitor_rts = 0
; lib_deps vacío — EI se detecta automáticamente desde lib/
; Servo controlado con LEDC nativo (sin ESP32Servo)
build_flags =
    -DBOARD_HAS_PSRAM
    -DEIDSP_USE_CMSIS_DSP=0
    -DEIDSP_QUANTIZE_FILTERBANK=0
    -DEI_CLASSIFIER_TFLITE_ENABLE_CMSIS_NN=0
    ; TEST A/B: ESP-NN DESACTIVADO para diagnosticar scores ~65 constantes
    ; con el modelo nuevo. Los kernels de referencia (ANSI C) son más lentos
    ; (~100-300ms vs 18ms) pero matemáticamente correctos.
    ; Si con esto el score da bajo para tapa buena y alto para tapa mala:
    ; los kernels S3 tienen un bug que el modelo nuevo activa → dejar en 0.
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN_S3=1
    ; Include paths que el CMake de esp-nn agrega y PlatformIO no conoce:
    -Ilib/SeparadorTapas2_inferencing/src/edge-impulse-sdk/porting/espressif/ESP-NN/include
    -Ilib/SeparadorTapas2_inferencing/src/edge-impulse-sdk/porting/espressif/ESP-NN/src/common
    -Ilib/SeparadorTapas2_inferencing/src/edge-impulse-sdk/porting/espressif/ESP-NN/src/softmax

; ── Entorno principal: anomaly detection con SeparadorTapas2 ──────────────────
; Incluye Camera.cpp y Classifier.cpp (modelo con anomaly detection habilitado)
[env:esp32-s3]
extends = common
build_src_filter = +<*> -<pictaker.cpp>

; ── Entorno de captura de dataset ────────────────────────────────────────────
; Solo compila Camera, WiFiManager y pictaker — sin EI ni Classifier
[env:pictaker]
extends = common
build_src_filter = -<*> +<Camera.cpp> +<WiFiManager.cpp> +<pictaker.cpp>
